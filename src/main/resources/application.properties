spring.application.name=eventos
server.port=8080

# H2 en archivo: los datos quedan en ./data/eventos.mv.db y sobreviven a un reinicio.
# La carpeta data/ está en .gitignore para no subir la base al repo.
# AUTO_SERVER=TRUE deja abrir la base desde la app y desde la consola a la vez.
spring.datasource.url=jdbc:h2:file:./data/eventos;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# update: Hibernate crea/actualiza las tablas según las entidades, sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Cierra la sesión de JPA al terminar el service (evita consultas escondidas en el controller).
spring.jpa.open-in-view=false

# Consola web de H2 en /h2-console
spring.h2.console.enabled=true

# Errores estándar de Spring en formato ProblemDetail
spring.mvc.problemdetails.enabled=true
